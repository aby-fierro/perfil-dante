<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TagMePet - Registro de Mascota</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --subtext: #64748b;
            --border: #e2e8f0;
            --success-bg: #f0fdf4;
            --success-border: #bbf7d0;
            --success-text: #166534;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 520px;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid var(--border);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 1.75rem;
            color: var(--primary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header p {
            color: var(--subtext);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group.half {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            background-color: #fff;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #resultado {
            display: none;
            margin-top: 24px;
            padding: 20px;
            background-color: var(--success-bg);
            border: 1px solid var(--success-border);
            border-radius: 12px;
            text-align: center;
        }

        #resultado h3 {
            color: var(--success-text);
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        #resultado p {
            font-size: 0.9rem;
            color: #15803d;
            margin-bottom: 12px;
        }

        .url-box {
            background: #ffffff;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--success-border);
            font-family: monospace;
            font-size: 0.9rem;
            word-break: break-all;
            margin-bottom: 14px;
            color: #0f172a;
        }

        .btn-link {
            display: inline-block;
            background-color: #166534;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .btn-link:hover {
            background-color: #14532d;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🏷️ TagMePet</h1>
            <p>Registra la información del collar inteligente de tu mascota</p>
        </div>

        <form id="formRegistro">
            <div class="form-group">
                <label for="nombre">Nombre de la Mascota *</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Peluche, Sol, Rocky" required>
            </div>

            <div class="form-group half">
                <div>
                    <label for="especie">Especie *</label>
                    <select id="especie" name="especie" required>
                        <option value="Perro">Perro</option>
                        <option value="Gato">Gato</option>
                        <option value="Hurón">Hurón</option>
                        <option value="Ave">Ave</option>
                        <option value="Conejo">Conejo</option>
                        <option value="Otra">Otra</option>
                    </select>
                </div>
                <div>
                    <label for="raza">Raza</label>
                    <input type="text" id="raza" name="raza" placeholder="Ej. Mestizo, Siames">
                </div>
            </div>

            <div class="form-group half">
                <div>
                    <label for="edad">Edad</label>
                    <input type="text" id="edad" name="edad" placeholder="Ej. 2 años">
                </div>
                <div>
                    <label for="contacto">Teléfono de Contacto *</label>
                    <input type="tel" id="contacto" name="contacto" placeholder="Ej. 6561234567" required>
                </div>
            </div>

            <div class="form-group">
                <label for="direccion">Ciudad / Dirección Aproximada</label>
                <input type="text" id="direccion" name="direccion" placeholder="Ej. Colonia Centro, Parral">
            </div>

            <div class="form-group">
                <label for="notas">Notas Médicas o de Comportamiento</label>
                <textarea id="notas" name="notas" placeholder="Ej. Es amigable, requiere medicamento diario, castrado..."></textarea>
            </div>

            <button type="submit">Generar Código y Perfil QR</button>
        </form>

        <div id="resultado">
            <h3>¡Mascota registrada con éxito! 🎉</h3>
            <p>Se ha generado el perfil único individual para esta mascota:</p>
            <div class="url-box" id="urlGenerada">https://...</div>
            <a href="#" id="btnAbrirPerfil" target="_blank" class="btn-link">Ver Perfil de Mascota</a>
        </div>
    </div>

    <script>
        document.getElementById('formRegistro').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const response = await fetch('/api/registrar-mascota', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (data.status === 'ok') {
                const fullUrl = window.location.origin + data.url;
                document.getElementById('urlGenerada').textContent = fullUrl;
                document.getElementById('btnAbrirPerfil').href = data.url;
                document.getElementById('resultado').style.display = 'block';
                
                document.getElementById('resultado').scrollIntoView({ behavior: 'smooth' });
            } else {
                alert('Hubo un error al registrar la mascota. Intenta de nuevo.');
            }
        });
    </script>
</body>
</html>
