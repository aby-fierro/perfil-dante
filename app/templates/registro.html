<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TagMePet - Alta de Collar Inteligente</title>
    <style>
        :root {
            --primary: #0d9488;
            --primary-dark: #0f766e;
            --bg: #f0fdfa;
            --card: #ffffff;
            --text-main: #0f172a;
            --text-sub: #334155;
            --border: #ccfbf1;
            --input-border: #cbd5e1;
            --success-green: #15803d;
            --success-bg: #f0fdf4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 12px;
        }

        .card-container {
            background: var(--card);
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(13, 148, 136, 0.15);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .header-tag {
            background: linear-gradient(135deg, #115e59 0%, #0f766e 100%);
            color: white;
            padding: 24px 20px;
            text-align: center;
            border-bottom: 4px solid #2dd4bf;
        }

        .header-tag h1 {
            font-size: 1.6rem;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header-tag p {
            color: #ccfbf1;
            font-size: 0.88rem;
            margin-top: 6px;
        }

        form {
            padding: 24px 20px;
        }

        .form-section {
            margin-bottom: 18px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            font-size: 0.95rem;
            background-color: #f8fafc;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        input[type="file"] {
            background-color: #ffffff;
            padding: 8px 10px;
            cursor: pointer;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 85px;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background-color: var(--primary-dark);
        }

        #resultadoCard {
            display: none;
            margin: 20px;
            padding: 20px;
            background-color: var(--success-bg);
            border: 1.5px solid #bbf7d0;
            border-radius: 14px;
            text-align: center;
        }

        #resultadoCard h3 {
            color: var(--success-green);
            font-size: 1.1rem;
            margin-bottom: 6px;
        }

        #resultadoCard p {
            font-size: 0.85rem;
            color: #166534;
            margin-bottom: 12px;
        }

        .url-display {
            background: #ffffff;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-family: monospace;
            font-size: 0.9rem;
            word-break: break-all;
            color: #0f172a;
            margin-bottom: 14px;
            font-weight: 600;
        }

        .btn-view {
            display: inline-block;
            width: 100%;
            background-color: var(--success-green);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .btn-view:hover {
            background-color: #14532d;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="header-tag">
            <h1>🏷️ TagMePet</h1>
            <p>Registro de Perfil de Emergencia para Collar QR</p>
        </div>

        <form id="formRegistro" enctype="multipart/form-data">
            <div class="form-section">
                <label for="nombre">Nombre de la Mascota *</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Sol, Frijol, Rocky, Pancho, Snoopy" required>
            </div>

            <div class="form-section">
                <label for="foto">📸 Fotografía de la Mascota</label>
                <input type="file" id="foto" name="foto" accept="image/*">
            </div>

            <div class="form-section grid-2">
                <div>
                    <label for="especie">Especie *</label>
                    <select id="especie" name="especie" required>
                        <option value="Perro">🐶 Perro</option>
                        <option value="Gato">🐱 Gato</option>
                        <option value="Hurón">🦦 Hurón</option>
                        <option value="Ave">🦜 Ave</option>
                        <option value="Conejo">🐰 Conejo</option>
                        <option value="Otra">🐾 Otra</option>
                    </select>
                </div>
                <div>
                    <label for="raza">Raza / Tipo</label>
                    <input type="text" id="raza" name="raza" placeholder="Ej. Mestizo, Schnauzer, Siamés">
                </div>
            </div>

            <div class="form-section grid-2">
                <div>
                    <label for="edad">Edad</label>
                    <input type="text" id="edad" name="edad" placeholder="Ej. 3 años, 8 meses">
                </div>
                <div>
                    <label for="contacto">Teléfono de Contacto *</label>
                    <input type="tel" id="contacto" name="contacto" placeholder="Ej. 627 123 4567" required>
                </div>
            </div>

            <div class="form-section">
                <label for="direccion">📍 Colonia / Dirección Aproximada</label>
                <input type="text" id="direccion" name="direccion" placeholder="Ej. Col. Tierra y Libertad, Anenecuilco #11">
            </div>

            <div class="form-section">
                <label for="notas">⚠️ Comportamiento y Salud</label>
                <textarea id="notas" name="notas" placeholder="Ej. Es perro de casa, desconfiado con desconocidos, cuenta con vacunas al día..."></textarea>
            </div>

            <button type="submit" class="btn-submit">
                ✨ Generar Ficha y Perfil Único
            </button>
        </form>

        <div id="resultadoCard">
            <h3>¡Ficha creada exitosamente! 🎉</h3>
            <p>Este es el enlace directo guardado para el collar de la mascota:</p>
            <div class="url-display" id="urlGenerada">https://...</div>
            <a href="#" id="btnAbrirPerfil" target="_blank" class="btn-view">📱 Abrir Ficha Individual</a>
        </div>
    </div>

    <script>
        document.getElementById('formRegistro').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const response = await fetch('/api/registrar-mascota', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (data.status === 'ok') {
                const fullUrl = window.location.origin + data.url;
                document.getElementById('urlGenerada').textContent = fullUrl;
                document.getElementById('btnAbrirPerfil').href = data.url;
                document.getElementById('resultadoCard').style.display = 'block';
                document.getElementById('resultadoCard').scrollIntoView({ behavior: 'smooth' });
            } else {
                alert('Ocurrió un error al registrar. Intenta de nuevo.');
            }
        });
    </script>
</body>
</html>
