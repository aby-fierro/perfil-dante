<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Dante - TagMePet</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; text-align: center; }
        .card { background: white; max-width: 400px; margin: auto; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        p { color: #555; }
        .btn { display: block; width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; text-decoration: none; font-weight: bold; color: white; border: none; cursor: pointer; box-sizing: border-box; font-size: 16px; }
        .btn-ws { background-color: #25D366; }
        .btn-call { background-color: #007bff; }
        .btn-geo { background-color: #ff9800; }
    </style>
</head>
<body>
    <div class="card">
        <h1>¡Hola, soy Dante! 🐾</h1>
        <p>Si me encontraste, por favor contacta a mi familia:</p>

        <!-- Botones de WhatsApp Directos -->
        <a href="https://wa.me/5216561234567?text=Hola,%20encontré%20a%20Dante!" class="btn btn-ws" target="_blank">💬 Enviar WhatsApp</a>
        <a href="tel:5216561234567" class="btn btn-call">📞 Llamar al Dueño</a>

        <!-- Botón de GPS -->
        <button onclick="compartirUbicacion('5216561234567')" class="btn btn-geo">📍 Compartir mi Ubicación GPS</button>
    </div>

    <script>
        function compartirUbicacion(telefono) {
            if (!navigator.geolocation) {
                alert("Tu dispositivo no soporta geolocalización.");
                return;
            }

            alert("Obteniendo ubicación GPS... Por favor acepta los permisos si tu teléfono los solicita.");

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    var lat = position.coords.latitude;
                    var lon = position.coords.longitude;
                    var urlMaps = "https://maps.google.com/?q=" + lat + "," + lon;
                    var mensaje = encodeURIComponent("¡Hola! Encontré a Dante en esta ubicación exacta: " + urlMaps);
                    
                    // Abre WhatsApp directamente con las coordenadas
                    window.location.href = "https://wa.me/" + telefono + "?text=" + mensaje;
                },
                function(error) {
                    alert("No se pudo obtener la ubicación. Revisa que tengas el GPS activado y le hayas dado permiso al navegador.");
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }
    </script>
</body>
</html>
